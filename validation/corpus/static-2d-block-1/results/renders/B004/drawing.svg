<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" viewBox="0 0 195 130" width="195" height="130" aria-labelledby="aixem-title aixem-desc" data-project="conformance:b004"><title id="aixem-title">B004 Annotation title block conformance project</title><desc id="aixem-desc">AIXEM deterministic symbol-graphics rendering. Connectivity follows the semantic source, not geometry.</desc><defs><pattern id="aixem-minor-grid" width="2.5" height="2.5" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".18" fill="#ECEDE9"/></pattern><pattern id="aixem-major-grid" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".32" fill="#D7D9D5"/></pattern><style>
svg{background:#FCFCFB;font-family:Arial,Helvetica,sans-serif;text-rendering:geometricPrecision}
.sheet-background{fill:#FCFCFB!important;stroke:none!important}.sheet-grid{pointer-events:none}.sheet-frame{fill:none;stroke:#8b918c;stroke-width:.45;vector-effect:non-scaling-stroke}
#layer-symbols .entity line,#layer-symbols .entity polyline,#layer-symbols .entity polygon,#layer-symbols .entity rect,#layer-symbols .entity circle,#layer-symbols .entity ellipse,#layer-symbols .entity path{stroke:#0C7772!important;vector-effect:non-scaling-stroke;stroke-linecap:square!important;stroke-linejoin:miter!important}
#layer-symbols .entity rect{fill:#fffef8!important}#layer-symbols .entity text{fill:#0C7772!important;stroke:none!important}
.net-route{stroke:#24864A!important;stroke-width:.68!important;stroke-linecap:square!important;stroke-linejoin:miter!important;fill:none;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
.net-junction{fill:#24864A!important;stroke:none!important}.net-label{font:600 3.4px Arial,sans-serif;fill:#1B4E8C!important;stroke:#fff!important;stroke-width:1.5!important;paint-order:stroke;letter-spacing:.02em}
.pin-name{font:600 2.65px Arial,sans-serif;fill:#0C7772!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-number{font:600 2.35px Arial,sans-serif;fill:#A33C30!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-target{fill:transparent;stroke:transparent;vector-effect:non-scaling-stroke}.entity:hover .pin-target,.entity.selected .pin-target{fill:#fff;stroke:#E18A24!important;stroke-width:.6!important}
.no-connect line{stroke:#a33c30;stroke-width:.7;vector-effect:non-scaling-stroke}.title-block line,.title-block rect{stroke:#626b65;stroke-width:.45;vector-effect:non-scaling-stroke;fill:#fffef8}.title-block text{fill:#2f3632;stroke:none;font-family:Arial,sans-serif}
.entity{cursor:pointer}.entity.selected>*:not(title),.entity.selected .pin-overlay>*{filter:drop-shadow(0 0 .8px #E18A24);stroke:#E18A24!important}.net.selected .net-route{stroke:#E18A24!important;stroke-width:1.2!important}.net.selected .net-junction{fill:#E18A24!important}
.annotation-label{fill:#1B4E8C!important}*{shape-rendering:geometricPrecision}
</style><marker id="dimension-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 6 0 L 0 3 L 6 6" fill="none" stroke="context-stroke"/></marker></defs><rect class="sheet-background" x="0" y="0" width="195" height="130"/><rect class="sheet-grid minor-grid" x="0" y="0" width="195" height="130" fill="url(#aixem-minor-grid)"/><rect class="sheet-grid major-grid" x="0" y="0" width="195" height="130" fill="url(#aixem-major-grid)"/><rect class="sheet-frame" x="8" y="8" width="179" height="114"/><g id="layer-connections" data-layer="connections" data-purpose="semantic net routes"></g><g id="layer-symbols" data-layer="symbols" data-purpose="component symbols"><g data-entity="X1" data-component-type="conformance:b004" aria-label="X1 — Annotation title block" tabindex="0" class="entity symbol-instance" transform="matrix(1 0 0 1 82.5 52.5)"><title>X1 — Annotation title block</title><rect id="X1-title-frame" data-symbol-layer="body" data-role="body" stroke="#0c7772" stroke-width="0.65" stroke-linecap="square" stroke-linejoin="miter" fill="#fffef8" x="-50" y="-20" width="100" height="40"/><line id="X1-title-row-a" data-symbol-layer="body" stroke="#0c7772" stroke-width="0.5" stroke-linecap="square" stroke-linejoin="miter" fill="none" x1="-50" y1="-5" x2="50" y2="-5"/><line id="X1-title-row-b" data-symbol-layer="body" stroke="#0c7772" stroke-width="0.5" stroke-linecap="square" stroke-linejoin="miter" fill="none" x1="-50" y1="7.5" x2="50" y2="7.5"/><line id="X1-title-col" data-symbol-layer="body" stroke="#0c7772" stroke-width="0.5" stroke-linecap="square" stroke-linejoin="miter" fill="none" x1="20" y1="-20" x2="20" y2="20"/><text id="X1-literal-project" data-symbol-layer="fields" data-role="annotation-label" stroke="none" fill="#0c7772" font-family="Arial, sans-serif" font-size="2.4" font-weight="500" x="-45" y="-12.5" text-anchor="start" dominant-baseline="middle">PROJECT</text><text id="X1-field-reference" data-symbol-layer="fields" data-role="reference-field" stroke="none" fill="#17231d" font-family="Arial, sans-serif" font-size="3.5" font-weight="600" x="-45" y="1.25" text-anchor="start" dominant-baseline="middle">X1</text><text id="X1-field-value" data-symbol-layer="fields" data-role="value-field" stroke="none" fill="#4f5e56" font-family="Arial, sans-serif" font-size="3.0" font-weight="400" x="-45" y="13.75" text-anchor="start" dominant-baseline="middle">Annotation title block</text><text id="X1-literal-rev" data-symbol-layer="fields" data-role="annotation-label" stroke="none" fill="#0c7772" font-family="Arial, sans-serif" font-size="3.0" font-weight="600" x="25" y="-12.5" text-anchor="start" dominant-baseline="middle">REV A</text></g></g><g id="layer-annotation" data-layer="annotation" data-purpose="notes"></g><g class="title-block" aria-label="Drawing title block"><rect x="63" y="99" width="122" height="21"/><line x1="63" y1="109" x2="185" y2="109"/><line x1="147" y1="109" x2="147" y2="120"/><line x1="166" y1="109" x2="166" y2="120"/><text x="67" y="105.4" font-size="4.1" font-weight="700">B004 — Annotation title block</text><text x="67" y="115.2" font-size="3.2">corpus_b004-layout</text><text x="150" y="113" font-size="2.2">REV</text><text x="156" y="117.2" font-size="3.6" font-weight="700">A</text><text x="169" y="113" font-size="2.2">SHEET</text><text x="173" y="117.2" font-size="3.6" font-weight="700">1/1</text></g></svg>
