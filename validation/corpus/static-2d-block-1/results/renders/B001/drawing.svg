<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" viewBox="0 0 180 130" width="180" height="130" aria-labelledby="aixem-title aixem-desc" data-project="conformance:b001"><title id="aixem-title">B001 Mechanical mounting plate conformance project</title><desc id="aixem-desc">AIXEM deterministic symbol-graphics rendering. Connectivity follows the semantic source, not geometry.</desc><defs><pattern id="aixem-minor-grid" width="2.5" height="2.5" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".18" fill="#ECEDE9"/></pattern><pattern id="aixem-major-grid" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".32" fill="#D7D9D5"/></pattern><style>
svg{background:#FCFCFB;font-family:Arial,Helvetica,sans-serif;text-rendering:geometricPrecision}
.sheet-background{fill:#FCFCFB!important;stroke:none!important}.sheet-grid{pointer-events:none}.sheet-frame{fill:none;stroke:#8b918c;stroke-width:.45;vector-effect:non-scaling-stroke}
#layer-symbols .entity line,#layer-symbols .entity polyline,#layer-symbols .entity polygon,#layer-symbols .entity rect,#layer-symbols .entity circle,#layer-symbols .entity ellipse,#layer-symbols .entity path{stroke:#0C7772!important;vector-effect:non-scaling-stroke;stroke-linecap:square!important;stroke-linejoin:miter!important}
