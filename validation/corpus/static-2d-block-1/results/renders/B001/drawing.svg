.net-route{stroke:#24864A!important;stroke-width:.68!important;stroke-linecap:square!important;stroke-linejoin:miter!important;fill:none;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
.net-junction{fill:#24864A!important;stroke:none!important}.net-label{font:600 3.4px Arial,sans-serif;fill:#1B4E8C!important;stroke:#fff!important;stroke-width:1.5!important;paint-order:stroke;letter-spacing:.02em}
.pin-name{font:600 2.65px Arial,sans-serif;fill:#0C7772!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-number{font:600 2.35px Arial,sans-serif;fill:#A33C30!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-target{fill:transparent;stroke:transparent;vector-effect:non-scaling-stroke}.entity:hover .pin-target,.entity.selected .pin-target{fill:#fff;stroke:#E18A24!important;stroke-width:.6!important}
.no-connect line{stroke:#a33c30;stroke-width:.7;vector-effect:non-scaling-stroke}.title-block line,.title-block rect{stroke:#626b65;stroke-width:.45;vector-effect:non-scaling-stroke;fill:#fffef8}.title-block text{fill:#2f3632;stroke:none;font-family:Arial,sans-serif}
.entity{cursor:pointer}.entity.selected>*:not(title),.entity.selected .pin-overlay>*{filter:drop-shadow(0 0 .8px #E18A24);stroke:#E18A24!important}.net.selected .net-route{stroke:#E18A24!important;stroke-width:1.2!important}.net.selected .net-junction{fill:#E18A24!important}
.annotation-label{fill:#1B4E8C!important}*{shape-rendering:geometricPrecision}
