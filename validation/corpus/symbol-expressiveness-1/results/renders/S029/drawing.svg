ircle class="pin-target" cx="0" cy="27.5" r="1.35" data-port="S"/></g></g></g><g id="layer-annotation" data-layer="annotation" data-purpose="notes"></g><g class="title-block" aria-label="Drawing title block"><rect x="48" y="124" width="122" height="21"/><line x1="48" y1="134" x2="170" y2="134"/><line x1="132" y1="134" x2="132" y2="145"/><line x1="151" y1="134" x2="151" y2="145"/><text x="52" y="130.4" font-size="4.1" font-weight="700">S029 — Irregular custom symbol</text><text x="52" y="140.2" font-size="3.2">corpus_s029-layout</text><text x="135" y="138" font-size="2.2">REV</text><text x="141" y="142.2" font-size="3.6" font-weight="700">A</text><text x="154" y="138" font-size="2.2">SHEET</text><text x="158" y="142.2" font-size="3.6" font-weight="700">1/1</text></g></svg>
