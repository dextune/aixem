<svg xmlns="http://www.w3.org/2000/svg" role="img" class="project-canvas" data-project-view="overview" viewBox="0 0 315 378" width="315" height="378" data-project="hierarchical:h004"><title>Same name local nets not connected — Project Overview</title><desc>Explicit project nets connect semantic sheet interface ports. Geometry does not create connectivity.</desc><defs><style>
.project-canvas{background:#FCFCFB;font-family:Arial,Helvetica,sans-serif;text-rendering:geometricPrecision}
.project-background{fill:#FCFCFB}.project-sheet-block{fill:#fffef8;stroke:#606963;stroke-width:.8;vector-effect:non-scaling-stroke}
.project-sheet-title{fill:#28302b;font-size:5px;font-weight:700;letter-spacing:.025em}.project-sheet-meta{fill:#69716c;font-size:3px}
.project-port{fill:#fff;stroke:#2458a6;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}.project-port-label{fill:#2458a6;font-size:3.1px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:1px}
.project-net-route{fill:none;stroke:#24864A;stroke-width:1.15;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.project-net-junction{fill:#24864A;stroke:none}.project-net-label{fill:#1B4E8C;font-size:3.3px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:1.2px}
.project-net.selected .project-net-route,.project-net-route.selected{stroke:#E18A24!important;stroke-width:2!important}.project-net.selected .project-net-junction{fill:#E18A24!important}
.project-port.selected{fill:#E18A24!important;stroke:#E18A24!important}.project-sheet-canvas{overflow:visible}
</style></defs><rect class="project-background" width="100%" height="100%"/><g class="project-sheet" data-sheet="alpha"><rect class="project-sheet-block" x="70" y="50" width="180" height="88"/><text class="project-sheet-title" x="78" y="64">Alpha</text><text class="project-sheet-meta" x="78" y="73">alpha · parent Root · 1 entities</text><circle class="project-port" data-sheet="alpha" data-interface-port="GND" data-qualified-interface="interface:alpha:GND" cx="160" cy="138" r="2.4"><title>alpha:@GND</title></circle><text class="project-port-label" data-sheet="alpha" data-interface-port="GND" data-qualified-interface="interface:alpha:GND" x="160" y="134" text-anchor="middle">GND</text><circle class="project-port" data-sheet="alpha" data-interface-port="VCC" data-qualified-interface="interface:alpha:VCC" cx="160" cy="50" r="2.4"><title>alpha:@VCC</title></circle><text class="project-port-label" data-sheet="alpha" data-interface-port="VCC" data-qualified-interface="interface:alpha:VCC" x="160" y="56" text-anchor="middle">VCC</text></g><g class="project-sheet" data-sheet="beta"><rect class="project-sheet-block" x="70" y="230" width="180" height="88"/><text class="project-sheet-title" x="78" y="244">Beta</text><text class="project-sheet-meta" x="78" y="253">beta · parent Root · 1 entities</text><circle class="project-port" data-sheet="beta" data-interface-port="GND" data-qualified-interface="interface:beta:GND" cx="160" cy="318" r="2.4"><title>beta:@GND</title></circle><text class="project-port-label" data-sheet="beta" data-interface-port="GND" data-qualified-interface="interface:beta:GND" x="160" y="314" text-anchor="middle">GND</text><circle class="project-port" data-sheet="beta" data-interface-port="VCC" data-qualified-interface="interface:beta:VCC" cx="160" cy="230" r="2.4"><title>beta:@VCC</title></circle><text class="project-port-label" data-sheet="beta" data-interface-port="VCC" data-qualified-interface="interface:beta:VCC" x="160" y="236" text-anchor="middle">VCC<