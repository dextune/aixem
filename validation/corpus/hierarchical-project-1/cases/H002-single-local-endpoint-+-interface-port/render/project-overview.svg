<svg xmlns="http://www.w3.org/2000/svg" role="img" class="project-canvas" data-project-view="overview" viewBox="0 0 385 378" width="385" height="378" data-project="hierarchical:h002"><title>Single local endpoint + interface port — Project Overview</title><desc>Explicit project nets connect semantic sheet interface ports. Geometry does not create connectivity.</desc><defs><style>
.project-canvas{background:#FCFCFB;font-family:Arial,Helvetica,sans-serif;text-rendering:geometricPrecision}
.project-background{fill:#FCFCFB}.project-sheet-block{fill:#fffef8;stroke:#606963;stroke-width:.8;vector-effect:non-scaling-stroke}
.project-sheet-title{fill:#28302b;font-size:5px;font-weight:700;letter-spacing:.025em}.project-sheet-meta{fill:#69716c;font-size:3px}
.project-port{fill:#fff;stroke:#2458a6;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}.project-port-label{fill:#2458a6;font-size:3.1px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:1px}
.project-net-route{fill:none;stroke:#24864A;stroke-width:1.15;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.project-net-junction{fill:#24864A;stroke:none}.project-net-label{fill:#1B4E8C;font-size:3.3px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:1.2px}
.project-net.selected .project-net-route,.project-net-route.selected{stroke:#E18A24!important;stroke-width:2!important}.project-net.selected .project-net-junction{fill:#E18A24!important}
.project-port.selected{fill:#E18A24!important;stroke:#E18A24!important}.project-sheet-canvas{overflow:visible}
