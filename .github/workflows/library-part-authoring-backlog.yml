name: Library Part Authoring Backlog Implementation

on:
  push:
    branches:
      - feature/library-part-authoring-backlog

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          python -m playwright install --with-deps chromium

      - name: Apply authoritative source changes
        run: |
          set -euxo pipefail
          python .github/aixem_apply_library_backlog.py
          python tools/library_backlog.py validate
          python -m unittest tests.docs.test_library_backlog

      - name: Remove temporary implementation machinery
        run: |
          rm .github/aixem_apply_library_backlog.py
          rm .github/workflows/library-part-authoring-backlog.yml

      - name: Run three complete validation passes
        run: |
          set -euxo pipefail
          for pass in 1 2 3; do
            echo "=== FULL VALIDATION PASS ${pass} / 3 ==="
            python tools/library_backlog.py validate
            python tools/docs/build_all.py
            python tools/docs/audit_repository_docs.py --require-redirects
            python tools/docs/validate_docs.py
            python tools/docs/build_manifest.py
            python tools/docs/run_tests.py
            python tools/docs/build_manifest.py
            python tools/docs/check_release.py
            echo "=== FULL VALIDATION PASS ${pass} COMPLETE ==="
          done

      - name: Commit exact validated tree
        run: |
          set -euxo pipefail
          git config user.name "aixem-validation-bot"
          git config user.email "aixem-validation-bot@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add scalable library part authoring backlog"

      - name: Final deterministic consistency check
        run: |
          set -euxo pipefail
          python tools/library_backlog.py validate
          python tools/docs/build_all.py
          python tools/docs/audit_repository_docs.py --require-redirects
          python tools/docs/validate_docs.py
          python tools/docs/build_manifest.py
          python tools/docs/check_release.py
          git diff --exit-code

      - name: Push exact validated tree
        run: |
          set -euxo pipefail
          git push origin HEAD:feature/library-part-authoring-backlog
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
