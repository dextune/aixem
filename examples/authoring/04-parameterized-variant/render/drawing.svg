e><line x1="113" y1="48" x2="117" y2="52"/><line x1="117" y1="48" x2="113" y2="52"/></g></g><g class="title-block" aria-label="Drawing title block"><rect x="28" y="69" width="122" height="21"/><line x1="28" y1="79" x2="150" y2="79"/><line x1="112" y1="79" x2="112" y2="90"/><line x1="131" y1="79" x2="131" y2="90"/><text x="32" y="75.4" font-size="4.1" font-weight="700">Parameterized variant</text><text x="32" y="85.2" font-size="3.2">parameterized_variant-layout</text><text x="115" y="83" font-size="2.2">REV</text><text x="121" y="87.2" font-size="3.6" font-weight="700">A</text><text x="134" y="83" font-size="2.2">SHEET</text><text x="138" y="87.2" font-size="3.6" font-weight="700">1/1</text></g></svg>
