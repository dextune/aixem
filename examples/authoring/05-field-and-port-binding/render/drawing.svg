<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" viewBox="0 0 160 100" width="160" height="100" aria-labelledby="aixem-title aixem-desc" data-project="authoring:field_port_binding"><title id="aixem-title">Field and Port Binding</title><desc id="aixem-desc">AIXEM deterministic symbol-graphics rendering. Connectivity follows the semantic source, not geometry.</desc><defs><pattern id="aixem-minor-grid" width="2.5" height="2.5" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".18" fill="#ECEDE9"/></pattern><pattern id="aixem-major-grid" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".32" fill="#D7D9D5"/></pattern><style>
svg{background:#FCFCFB;font-family:Arial,Helvetica,sans-serif;text-rendering:geometricPrecision}
.sheet-background{fill:#FCFCFB!important;stroke:none!important}.sheet-grid{pointer-events:none}.sheet-frame{fill:none;stroke:#8b918c;stroke-width:.45;vector-effect:non-scaling-stroke}
#layer-symbols .entity line,#layer-symbols .entity polyline,#layer-symbols .entity polygon,#layer-symbols .entity rect,#layer-symbols .entity circle,#layer-symbols .entity ellipse,#layer-symbols .entity path{stroke:#0C7772!important;vector-effect:non-scaling-stroke;stroke-linecap:square!important;stroke-linejoin:miter!important}
#layer-symbols .entity rect{fill:#fffef8!important}#layer-symbols .entity text{fill:#0C7772!important;stroke:none!important}
.net-route{stroke:#24864A!important;stroke-width:.68!important;stroke-linecap:square!important;stroke-linejoin:miter!important;fill:none;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
.net-junction{fill:#24864A!important;stroke:none!important}.net-label{font:600 3.4px Arial,sans-serif;fill:#1B4E8C!important;stroke:#fff!important;stroke-width:1.5!important;paint-order:stroke;letter-spacing:.02em}
.pin-name{font:600 2.65px Arial,sans-serif;fill:#0C7772!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-number{font:600 2.35px Arial,sans-serif;fill:#A33C30!important;stroke:#fff!important;stroke-width:.7!important;paint-order:stroke;pointer-events:none}
.pin-target{fill:transparent;stroke:transparent;vector-effect:non-scaling-stroke}.entity:hover .pin-target,.entity.selected .pin-target{fill:#fff;stroke:#E18A24!important;stroke-width:.6!important}
.no-connect line{stroke:#a33c30;stroke-width:.7;vector-effect:non-scaling-stroke}.title-block line,.title-block rect{stroke:#626b65;stroke-width:.45;vector-effect:non-scaling-stroke;fill:#fffef8}.title-block text{fill:#2f3632;stroke:none;font-family:Arial,sans-serif}
.entity{cursor:pointer}.entity.selected>*:not(title),.entity.selected .pin-overlay>*{filter:drop-shadow(0 0 .8px #E18A24);stroke:#E18A24!important}.net.selected .net-route{stroke:#E18A24!important;stroke-width:1.2!important}.net.selected .net-junction{fill:#E18A24!important}
.annotation-label{fill:#1B4E8C!important}*{shape-rendering:geometricPrecision}
</style><marker id="dimension-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 6 0 L 0 3 L 6 6" fill="none" stroke="context-stroke"/></marker></defs><rect class="sheet-background" x="0" y="0" width="160" height="100"/><rect class="sheet-grid minor-grid" x="0" y="0" width="160" height="100" fill="url(#aixem-minor-grid)"/><rect class="sheet-grid major-grid" x="0" y="0" width="160" height="100" fill="url(#aixem-major-grid)"/><rect class="sheet-frame" x="8" y="8" width="144" height="84"/><g id="layer-connections" data-layer="connections" data-purpose="semantic net routes"></g><g id="layer-symbols" data-layer="symbols" data-purpose="component symbols"><g data-entity="S1" data-component-type="authoring:sensor" aria-label="S1 — Bound sensor" tabindex="0" class="entity symbol-instance" transform="matrix(1 0 0 1 80 50)"><title>S1 — Bound sensor</title><rect id="S1-body" data-symbol-layer="body" data-role="body" stroke="#0c7772" stroke-width="0.65" stroke-linecap="square" stroke-linejoin="miter" fill="#fffef8" x="-10" y="-5" width="20" height="10"/><line id="S1-lead-p-left" data-symbol-layer="body" data-role="pin-lead" stroke="#0c7772" stroke-width="0.65" stroke-linecap="square" stroke-linejoin="miter" fill="none" x1="-15" y1="0" x2="-10" y2="0"/><line id="S1-lead-p-right" data-symbol-layer="body" data-role="pin-lead" stroke="#0c7772" stroke-width="0.65" stroke-linecap="square" stroke-linejoin="miter" fill="none" x1="10" y1="0" x2="15" y2="0"/><text id="S1-field-reference" data-symbol-layer="fields" data-role="reference-field" stroke="none" fill="#17231d" font-family="Arial, sans-serif" font-size="3.5" font-weight="600" x="0" y="-10" text-anchor="middle" dominant-baseline="middle">S1</text><text id="S1-field-value" data-symbol-layer="fields" data-role="value-field" stroke="none" fill="#4f5e56" font-family="Arial, sans-serif" font-size="3.0" font-weight="400" x="0" y="10" text-anchor="middle" dominant-baseline="middle">5V_OVERRIDE</text><text id="S1-field-deviceLabel" data-symbol-layer="fields" data-role="deviceLabel-field" stroke="none" fill="#17231d" font-family="Arial, sans-serif" font-size="3.5" font-weight="600" x="0" y="0" text-anchor="middle" dominant-baseline="middle">TEMP</text><g class="pin-overlay"><text class="pin-name" data-pin-name="p-left" x="-12" y="-0.8" text-anchor="start">IN</text><text class="pin-number" data-pin-number="p-left" x="-17" y="-0.8" text-anchor="end">1</text><circle class="pin-target" cx="-15" cy="0" r="1.35" data-port="p-left"/><text class="pin-name" data-pin-name="p-right" x="12" y="-0.8" text-anchor="end">OUT</text><text class="pin-number" data-pin-number="p-right" x="17" y="-0.8" text-anchor="start">2</text><circle class="pin-target" cx="15" cy="0" r="1.35" data-port="p-right"/></g></g></g><g id="layer-annotation" data-layer="annotation" data-purpose="notes"></g><g id="layer-no-connect" data-layer="no-connect"><g class="no-connect" data-endpoint="S1.in"><title>No connect S1.in</title><line x1="63" y1="48" x2="67" y2="52"/><line x1="67" y1="48" x2="63" y2="52"/></g><g class="no-connect" data-endpoint="S1.out"><title>No connect S1.out</title><line x1="93" y1="48" x2="97" y2="52"/><line x1="97" y1="48" x2="93" y2="52"/></g></g><g class="title-block" aria-label="Drawing title block"><rect x="28" y="69" width="122" height="21"/><line x1="28" y1="79" x2="150" y2="79"/><line x1="112" y1="79" x2="112" y2="90"/><line x1="131" y1="79" x2="131" y2="90"/><text x="32" y="75.4" font-size="4.1" font-weight="700">Field and port binding</text><text x="32" y="85.2" font-size="3.2">field_port_binding-layout</text><text x="115" y="83" font-size="2.2">REV</text><text x="121" y="87.2" font-size="3.6" font-weight="700">A</text><text x="134" y="83" font-size="2.2">SHEET</text><text x="138" y="87.2" font-size="3.6" font-weight="700">1/1</text></g></svg>
