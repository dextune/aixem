schema: https://schemas.aixem.org/documentation/task-route/1
formatVersion: '1.0'
id: build-documentation
intent: build-documentation
aliases:
- build documentation
- compile docs
- generate site
- build reference index
- documentation compiler
summary: Build documentation and agent indexes
budget:
